  en: "MiniMaxH3Fast"

description:
  zh: "MiniMax H3 满血 FP16 加速版：FP16 原版模型 + 8 步蒸馏 LoRA，兼顾画质与速度。"
  en: "Accelerated MiniMax H3 engine: full FP16 pipeline with an 8-step distilled LoRA for fast, high-quality video generation."

