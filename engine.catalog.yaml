description_long:
  zh: |-
    MiniMax H3 极速版在满血 FP16 原版模型上叠加 8 步蒸馏 LoRA，用明显更少的采样步数换取出片速度，画质尽量贴近原版。

    适合预览、批量草稿、分镜试拍与需要快速迭代的场景；需要最终交付画质时，建议仍切换到标准版生成。

    运行依赖 NVIDIA GPU 与 torch >= 2.5.0，显存需求与标准版接近；蒸馏只减少采样步数，不降低模型本身的权重精度。
  en: |-
    MiniMax H3 Fast stacks an 8-step distilled LoRA on the full FP16 base model, cutting sampling steps for much faster output while staying close to the original in quality.

    It fits previews, batch drafts, storyboard tests and fast iteration; for final delivery quality, switch back to the standard engine.

    An NVIDIA GPU and torch >= 2.5.0 are required, and VRAM usage is close to the standard version. Distillation only reduces sampling steps, not the weight precision itself.
